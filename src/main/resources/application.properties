spring.application.name=mathproject

# Heroku's Java buildpack supplies SPRING_DATASOURCE_* when Postgres is attached.
# The H2 fallback keeps local development and tests self-contained.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mathproject}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.connections.pooling=WARN
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8080}
server.forward-headers-strategy=native

# Set JWT_SECRET in production. This fallback is only for local development.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production}
app.demo-data.enabled=${DEMO_DATA:false}
app.demo-login.enabled=${DEMO_LOGIN:${DEMO_DATA:false}}
